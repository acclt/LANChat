<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <link rel="stylesheet" href="css/style.css">
        <title>LANChat</title>
    </head>
    <body>
        <div id="edit-name-panel" class="edit-panel" style="display: none;">
            <input type="text" id="new-name-input" data-i18n="name_placeholder" placeholder="输入新名字" maxlength="50">
            <div class="button-group">
                <button id="save-name-btn" data-i18n="save">保存</button>
                <button id="cancel-name-btn" data-i18n="cancel">取消</button>
            </div>
            <div id="error-msg" class="error-msg"></div>
        </div>
        <div id="settings-panel" class="settings-panel" style="display: none;">
            <h3 data-i18n="settings">设置</h3>
            <div class="settings-content">
                <div class="setting-item">
                    <label for="port-input" data-i18n="port_label">端口:</label>
                    <div class="path-input-group">
                        <input type="number" id="port-input" class="no-spinner" placeholder="8888" min="1" max="65535">
                    </div>
                </div>
                <div class="setting-item" id="db-path-setting">
                    <label for="db-path-input" data-i18n="db_path_label">数据库路径:</label>
                    <div class="path-input-group">
                        <input type="text" id="db-path-input">
                        <button id="choose-db-path-btn" data-i18n="choose">选择</button>
                    </div>
                </div>
                <div class="setting-item">
                    <label for="download-path-input" data-i18n="download_path_label">下载路径:</label>
                    <div class="path-input-group">
                        <input type="text" id="download-path-input">
                        <button id="choose-path-btn" data-i18n="choose">选择</button>
                    </div>
                </div>
                <div class="setting-item">
                    <div class="setting-label-row">
                        <label for="auto-download-toggle" data-i18n="auto_download_label">自动下载:</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="auto-download-toggle" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
                <div class="button-group">
                    <button id="save-settings-btn" data-i18n="save">保存</button>
                    <button id="cancel-settings-btn" data-i18n="cancel">取消</button>
                </div>
                <div id="settings-success-msg" class="success-msg"></div>
                <div id="settings-error-msg" class="error-msg"></div>
            </div>
        </div>
        <div id="add-peer-panel" class="settings-panel" style="display: none;">
            <h3 data-i18n="add_peer_title">手动添加设备</h3>
            <div class="settings-content">
                <div class="setting-item">
                    <label for="custom-peer-input" data-i18n="peer_input_label">IP / 域名:端口</label>
                    <div class="custom-peer-input-group">
                        <input type="text" id="custom-peer-input" data-i18n="peer_input_placeholder" placeholder="例: 192.168.1.100 或 myhost.local:8888">
                        <button id="add-custom-peer-btn" data-i18n="add">添加</button>
                    </div>
                    <div id="custom-peer-list" class="custom-peer-list"></div>
                </div>
                <div class="button-group">
                    <button id="save-peer-btn" data-i18n="save">保存</button>
                    <button id="cancel-peer-btn" data-i18n="cancel">取消</button>
                </div>
                <div id="peer-success-msg" class="success-msg"></div>
                <div id="peer-error-msg" class="error-msg"></div>
            </div>
        </div>
        <div id="theme-panel" class="theme-panel" style="display: none;">
            <div class="theme-content">
                <div class="theme-section">
                    <h3 id="language-section-title" data-i18n="language">语言 / Language</h3>
                    <div class="language-list">
                        <div class="theme-item lang-item" data-lang="zh">
                            <input type="radio" id="lang-zh" name="lang" value="zh">
                            <label for="lang-zh">中文</label>
                        </div>
                        <div class="theme-item lang-item" data-lang="en">
                            <input type="radio" id="lang-en" name="lang" value="en">
                            <label for="lang-en">English</label>
                        </div>
                    </div>
                </div>
                <div class="theme-section">
                    <h3 data-i18n="theme">主题</h3>
                    <div class="theme-list" id="theme-list">
                        <div class="theme-item">
                            <input type="radio" id="theme-default" name="theme" value="default" checked>
                            <label for="theme-default" data-i18n="theme_default">默认主题</label>
                        </div>
                    </div>
                </div>
                <div class="button-group">
                    <button id="apply-theme-btn" data-i18n="apply">应用</button>
                    <button id="cancel-theme-btn" data-i18n="cancel">取消</button>
                </div>
                <div id="theme-success-msg" class="success-msg"></div>
                <div id="theme-error-msg" class="error-msg"></div>
            </div>
        </div>
        <div id="android-path-panel"
             class="android-path-panel"
             style="display: none">
            <h2>选择下载路径</h2>
            <div class="android-path-content">
                <div class="path-option" data-path="/storage/emulated/0/Download/LANChat">
                    <div class="path-name">下载文件夹</div>
                    <div class="path-value">/storage/emulated/0/Download/LANChat</div>
                </div>
                <div class="path-option" data-path="/storage/emulated/0/Documents/LANChat">
                    <div class="path-name">文档文件夹</div>
                    <div class="path-value">/storage/emulated/0/Documents/LANChat</div>
                </div>
                <div class="path-option" data-path="/storage/emulated/0/LANChat">
                    <div class="path-name">根目录</div>
                    <div class="path-value">/storage/emulated/0/LANChat</div>
                </div>
                <div class="custom-path-input">
                    <input type="text" id="custom-path-input" placeholder="或输入自定义路径...">
                    <button id="use-custom-path-btn">使用</button>
                </div>
                <div class="button-group">
                    <button id="cancel-android-path-btn">取消</button>
                </div>
            </div>
        </div>
        <div class="container">
            <div class="main-content">
                <div class="user-list-container">
                    <ul id="user-list">
                    </ul>
                </div>
                <div class="chat-container" id="chat-container" style="display: none;">
                    <div class="chat-header">
                        <button id="close-chat-btn" title="返回">
                            <svg viewBox="0 0 24 24"
                                 width="24"
                                 height="24"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 fill="none"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg>
                        </button>
                        <h3 id="chat-with-name">用户名</h3>
                        <button id="select-mode-btn" title="多选">
                            <svg viewBox="0 0 24 24"
                                 width="20"
                                 height="20"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 fill="none"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="chat-messages" id="chat-messages"></div>
                    <div class="chat-input-container">
                        <input type="file" id="file-input" style="display: none;" />
                        <button id="attach-file-btn" title="发送文件">📎</button>
                        <textarea id="chat-input" placeholder="输入消息..." rows="1"></textarea>
                        <button id="send-btn">发送</button>
                    </div>
                </div>
            </div>
            <div class="header">
                <h1 id="my-name">正在加载...</h1>
                <div class="header-buttons">
                    <button id="add-peer-btn">添加</button>
                    <button id="settings-btn">设置</button>
                    <button id="theme-btn">主题</button>
                </div>
            </div>
        </div>
        <!-- 引入 JS -->
        <script src="js/api.js"></script>
        <script src="js/ui.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
